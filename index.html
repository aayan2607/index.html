<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url(https://images.pexels.com/photos/5874620/pexels-photo-5874620.jpeg?cs=srgb&dl=pexels-gabby-k-5874620.jpg&fm=jpg);
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h1 {
      color: crimson;
      margin-bottom: 30px;
    }
    .btn {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.0s;
    }
    .yes {
      background: crimson;
      color: white;
    }
    .yes:hover {
      background: darkred;
    }
    .no {
      background: lightgray;
      color: black;
      position: relative;
    }

    /* Celebration modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: crimson; /* solid background */
      color: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: pop 0.5s ease;
    }
    .modal-content img {
      max-width: 200px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Will you be my Valentine? ❤️</h1>
    <button class="btn yes" onclick="showCelebration()">Yes</button>
    <button class="btn no" onmouseover="moveButton(this)">No</button>
  </div>

  <!-- Celebration Modal -->
  <div class="modal" id="celebrationModal">
    <div class="modal-content">
      🎉 Yay! You said YES ❤️<br>
      Love you my madamjii
      <br>
      <img src="https://media.tenor.com/mfC-cc_TL_sAAAAM/thank-you.gif" alt="Celebration Gif">
    </div>
  </div>

  <script>
    function moveButton(btn) {
      const x = Math.floor(Math.random() * 200) - 100;
      const y = Math.floor(Math.random() * 200) - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function showCelebration() {
      const modal = document.getElementById('celebrationModal');
      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
